<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070811">
  <title>AURA AHL AI — Layout V2</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080911;
      --sidebar: #090a13;
      --surface: #121421;
      --border: #282a3b;
      --text: #f1f2fb;
      --muted: #9095aa;
      --cyan: #40e7fb;
      --green: #56f7a1;
      --blue: #5589ff;
      --purple: #a16aff;
      --pink: #fc51db;
      --rainbow: linear-gradient(108deg, #55f8a8 0%, #36dffc 26%, #6d8cff 51%, #ad61f2 75%, #fc5cda 100%);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    svg { display: block; }
    .app { display: flex; height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }
    .sidebar {
      flex: 0 0 256px; width: 256px; min-width: 0;
      background: linear-gradient(180deg, #10111d 0%, #090a13 58%, #080a12 100%);
      border-right: 1px solid #29253b;
      display: flex; flex-direction: column; z-index: 20; overflow-y: auto; overscroll-behavior: contain;
      transition: flex-basis .23s ease, width .23s ease, transform .23s ease;
    }
    .sidebar-top { height: 76px; display: flex; align-items: center; padding: 0 20px; gap: 12px; }
    .menu-word { font-size: 11px; text-transform: uppercase; color: #9397b2; letter-spacing: .24em; font-weight: 750; }
    .sidebar-top::after { content: ""; display: block; height: 1px; flex: 1; opacity: .7; background: linear-gradient(90deg, #36def0, #a56cf8, transparent); }
    .sidebar-section { padding: 11px 12px; }
    .sidebar-row {
      width: 100%; display: flex; align-items: center; gap: 13px; padding: 13px 15px;
      color: #e1e1f3; font-size: 13px; font-weight: 580; text-align: left;
      border-radius: 12px; border: 1px solid transparent; background: transparent;
    }
    .sidebar-row svg { color: #97a0bc; flex-shrink: 0; }
    .sidebar-row.highlight { background: #161728; border-color: #303044; }
    .sidebar-row.highlight svg { color: var(--cyan); }
    .sidebar-label { padding: 25px 16px 10px; color: #767b99; font-size: 10px; letter-spacing: .19em; font-weight: 800; text-transform: uppercase; }
    .sidebar-blank { flex: 1; min-height: 18px; }
    .sidebar-bottom { margin: 0 19px 23px; height: 2px; border-radius: 4px; background: var(--rainbow); opacity: .68; }
    /* V2: Options > Brain accordion, kept within the existing left menu. */
    .options-section { padding-bottom: 0; }
    .sidebar-row--button { appearance: none; font-family: inherit; }
    .sidebar-row--button:hover { background: #1b1a2d; border-color: #34304e; }
    .sidebar-row--button[aria-expanded="true"] { color: #e8e5ff; background: #171827; border-color: #36344f; }
    .sidebar-chevron { width: 15px; height: 15px; margin-left: auto; color: #ac9fcf !important; transition: transform .17s ease; }
    .sidebar-row--button[aria-expanded="true"] .sidebar-chevron { transform: rotate(90deg); }
    .options-group { margin: 5px 0 0 11px; border-left: 1px solid #44405a; padding: 4px 0 0 9px; }
    .options-group[hidden], .brain-card[hidden], .brain-progress[hidden] { display: none !important; }
    .options-group .sidebar-row { padding: 11px 10px; font-size: 12px; }
    .brain-card { background: linear-gradient(155deg, #1a1b2e, #10121e); border: 1px solid #38364c; border-radius: 13px; margin: 6px 0 7px 1px; padding: 13px 10px 12px; }
    .brain-model-name { font-size: 12px; font-weight: 800; color: #e5e9ff; letter-spacing: .025em; }
    .brain-desc { font-size: 10px; color: #9b9fb7; line-height: 1.6; margin-top: 5px; }
    .brain-download { width: 100%; min-height: 39px; padding: 9px 8px; border-radius: 10px; border: none; background: var(--rainbow); color: #071019; font-size: 11px; font-weight: 800; margin-top: 12px; }
    .brain-download:disabled { cursor: default; opacity: .66; }
    .brain-track { width: 100%; height: 6px; background: #34344a; border-radius: 15px; overflow: hidden; margin-top: 11px; }
    .brain-fill { height: 100%; width: 0; background: var(--rainbow); transition: width .2s ease; }
    .brain-status { color: #a9b0c5; margin-top: 9px; font-size: 10px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-line; }
    .brain-status[data-error="true"] { color: #ffa6ac; }
    .brain-capability { font-size: 10px; color: #85dece; margin-top: 9px; line-height: 1.45; overflow-wrap: anywhere; }
    .brain-capability[data-ok="false"] { color: #ffc08f; }
    .brain-card button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    .main { flex: 1; position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--bg); isolation: isolate; }
    .main::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1;
      background: radial-gradient(ellipse 48% 56% at 97% 15%, rgba(111, 34, 155, .075), transparent 80%),
                  radial-gradient(ellipse 65% 45% at 8% 100%, rgba(12, 157, 158, .065), transparent 77%),
                  radial-gradient(ellipse 44% 34% at 80% 94%, rgba(95, 48, 155, .04), transparent 78%);
    }
    .topbar { flex: 0 0 auto; display: flex; align-items: center; gap: 13px; height: 78px; padding: 0 clamp(14px, 2.25vw, 36px); }
    .icon-btn { background: transparent; border: 1px solid transparent; color: #c5c8dc; width: 43px; height: 43px; padding: 11px; display: grid; place-items: center; border-radius: 11px; }
    .icon-btn:hover { background: #1c1e31; border-color: #33334a; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-icon { width: 44px; height: 44px; object-fit: cover; border-radius: 12px; display: block; box-shadow: 0 0 19px #9633cb3c; }
    .brand-name { font-weight: 800; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.25; letter-spacing: .03em; white-space: nowrap; }
    .brand-name span { background: var(--rainbow); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .work-area { flex: 1; min-height: 0; position: relative; }
    .composer-area { flex: 0 0 auto; width: 100%; padding: 0 26px calc(29px + env(safe-area-inset-bottom, 0px)); }
    .composer { width: min(100%, 850px); margin: 0 auto; border: 1px solid #3a354c; background: linear-gradient(155deg, #1a1a2b 0%, #171724 100%); border-radius: 28px; display: flex; align-items: flex-end; padding: 12px 13px 12px 20px; gap: 15px; box-shadow: 0 11px 40px #0005, 0 0 30px #5f37991a; }
    .composer:focus-within { border-color: #666094; box-shadow: 0 10px 40px #0006, 0 0 27px #7c50d321; }
    .composer textarea { resize: none; outline: none; border: 0; color: #e9ebf5; background: transparent; font-size: 15px; line-height: 24px; width: 100%; min-height: 28px; max-height: 164px; padding: 4px 0; scrollbar-width: thin; overflow-y: auto; }
    .composer textarea::placeholder { color: #9496ab; opacity: 1; }
    .send-btn { width: 37px; height: 37px; flex: 0 0 37px; border: 0; border-radius: 50%; color: #090d18; background: var(--rainbow); display: grid; place-items: center; padding: 9px; box-shadow: 0 0 17px #5953d93d; }
    .send-btn:hover { filter: brightness(1.14); }
    .mobile-scrim { display: none; }
    .app.sidebar-hidden .sidebar { flex-basis: 0; width: 0; overflow: hidden; border: 0; }
    .app.sidebar-hidden .sidebar > * { min-width: 256px; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid #52e9de; outline-offset: 3px; }
    @media (max-width: 720px) {
      .sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; flex-basis: 280px; box-shadow: 16px 0 55px #0008; }
      .app:not(.sidebar-open) .sidebar { transform: translateX(-105%); }
      .app.sidebar-hidden .sidebar { width: 280px; flex-basis: 280px; overflow: visible; border-right: 1px solid #29253b; }
      .mobile-scrim { position: fixed; inset: 0; background: #0009; z-index: 15; }
      .app.sidebar-open .mobile-scrim { display: block; }
      .topbar { height: 72px; padding: 0 14px; gap: 7px; }
      .brand { gap: 9px; }
      .brand-icon { width: 38px; height: 38px; border-radius: 11px; }
      .brand-name { font-size: 16px; letter-spacing: 0; }
      .composer-area { padding: 0 12px calc(14px + env(safe-area-inset-bottom, 0px)); }
      .composer { padding: 9px 10px 9px 16px; border-radius: 23px; }
      .composer textarea { font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; } }

    /* V3: Chat messages only — preserve the V2 layout and AHL colour scheme. */
    .work-area { overflow-y:auto; overscroll-behavior:contain; scroll-behavior:smooth; scrollbar-color:#3c3854 transparent; }
    .chat-stream { width:min(100%, 900px); min-height:100%; margin:0 auto; display:flex; flex-direction:column; gap:22px; padding:22px clamp(16px, 3vw, 30px) 30px; }
    .chat-turn { display:flex; width:100%; flex:0 0 auto; }
    .chat-turn.user { justify-content:flex-end; }
    .chat-turn.assistant { justify-content:flex-start; }
    .chat-bubble { max-width:min(86%, 680px); overflow-wrap:anywhere; white-space:pre-wrap; font-size:15px; line-height:1.7; }
    .chat-turn.user .chat-bubble { padding:12px 17px; color:#f0eefb; background:#1d1b2e; border:1px solid #39344e; border-radius:21px 21px 6px 21px; }
    .chat-turn.assistant .chat-bubble { padding:2px 4px; color:#e7eaf6; }
    .chat-turn.assistant .chat-bubble::selection, .chat-turn.user .chat-bubble::selection { background:#6666a3; }
    .chat-turn.assistant .chat-bubble.is-generating:empty::after { content:'● ● ●'; font-size:12px; letter-spacing:4px; color:var(--cyan); animation:auraThinking 1.4s ease-in-out infinite; }
    @keyframes auraThinking { 0%,100%{opacity:.4} 50%{opacity:1} }
    .chat-turn.assistant .chat-bubble.is-error { color:#ffb6bd; }
    .chat-notice { text-align:center; font-size:12px; color:#ada7c5; margin:auto auto 8px; padding:11px 15px; background:#171527; border:1px solid #39334d; border-radius:12px; max-width:90%; }
    .chat-notice[hidden] { display:none; }
    .send-btn:disabled { opacity:.5; cursor:wait; }
    @media(max-width:720px) { .chat-stream { padding:12px 15px 22px; gap:18px; } .chat-bubble { font-size:14px; max-width:93%; } }
  </style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Left menu">
    <div class="sidebar-top"><span class="menu-word">Menu</span></div>
    <div class="sidebar-section options-section">
      <button type="button" class="sidebar-row sidebar-row--button" id="optionsToggle" aria-expanded="false" aria-controls="optionsGroup">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="#10111d"/><circle cx="16" cy="12" r="2" fill="#10111d"/><circle cx="8" cy="17" r="2" fill="#10111d"/></svg>
        <span>Options</span>
        <svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </button>
      <div class="options-group" id="optionsGroup" hidden>
        <button type="button" class="sidebar-row sidebar-row--button" id="brainToggle" aria-expanded="false" aria-controls="brainCard">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c-1.5-1.3-4.2-.9-5 1.3-2.3-.1-3.9 2.5-2.9 4.2-1.7 1.3-1.7 4 0 5.3-.6 2.1 1.2 4.1 3.4 3.9 1.3 2 3.8 2.5 5 1.3V3.5Zm0 0c1.5-1.3 4.2-.9 5 1.3 2.3-.1 3.9 2.5 2.9 4.2 1.7 1.3 1.7 4 0 5.3.6 2.1-1.2 4.1-3.4 3.9-1.3 2-3.8 2.5-5 1.3V3.5Z"/></svg>
          <span>Brain</span>
          <svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        </button>
        <div class="brain-card" id="brainCard" hidden>
          <div class="brain-model-name">Qwen3.5 4B</div>
          <div class="brain-desc">Qwen3.5 4B · Native llama.cpp engine. Download approx. 2.8 GB once; the model stays in this app and works offline. Needs free storage and RAM.</div>
          <button class="brain-download" type="button" id="brainDownload">⬇ Download &amp; load brain</button>
          <div class="brain-progress" id="brainProgress" hidden>
            <div class="brain-track" id="brainTrack" role="progressbar" aria-label="Qwen model download progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="brain-fill" id="brainFill"></div></div>
          </div>
          <div class="brain-status" id="brainStatus" aria-live="polite">Not loaded yet.</div>
          <div class="brain-capability" id="brainCapability" aria-live="polite">Connecting to native Android engine…</div>
        </div>
      </div>
    </div>
    <div class="sidebar-section">
      <button class="sidebar-row highlight" type="button" id="newChat" aria-label="Start a new chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3v5"/><path d="M14 19h7M17.5 15.5v7"/></svg>
        <span>New chat</span>
      </button>
      <div class="sidebar-label">Chats</div>
    </div>
    <div class="sidebar-blank"></div>
    <div class="sidebar-bottom" aria-hidden="true"></div>
  </aside>
  <div class="mobile-scrim" id="scrim" aria-hidden="true"></div>
  <main class="main">
    <header class="topbar">
      <button type="button" class="icon-btn" id="menuButton" aria-label="Toggle menu" aria-controls="sidebar" aria-expanded="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>

<script>
  // Sidebar and composer sizing — the real Qwen conversation is connected below.
  const app = document.getElementById('app');
  const menuButton = document.getElementById('menuButton');
  const scrim = document.getElementById('scrim');
  const message = document.getElementById('message');
  function mobile() { return window.matchMedia('(max-width: 720px)').matches; }
  function updateMenuLabel() { menuButton.setAttribute('aria-expanded', mobile() ? String(app.classList.contains('sidebar-open')) : String(!app.classList.contains('sidebar-hidden'))); }
  menuButton.addEventListener('click', () => { if (mobile()) app.classList.toggle('sidebar-open'); else app.classList.toggle('sidebar-hidden'); updateMenuLabel(); });
  scrim.addEventListener('click', () => { app.classList.remove('sidebar-open'); updateMenuLabel(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { app.classList.remove('sidebar-open'); updateMenuLabel(); } });
  window.addEventListener('resize', () => { if (!mobile()) app.classList.remove('sidebar-open'); updateMenuLabel(); });
  message.addEventListener('input', () => { message.style.height='auto'; message.style.height=Math.min(message.scrollHeight, 164)+'px'; });
  updateMenuLabel();
</script>

<script>
  // AURA Native V1: the HTML is the VIEW ONLY; React Native + llama.rn run Qwen.
  // No browser WebGPU / no WebLLM dependency.
  const optionsButton = document.getElementById('optionsToggle');
  const optionsGroup = document.getElementById('optionsGroup');
  const brainButton = document.getElementById('brainToggle');
  const brainCard = document.getElementById('brainCard');
  const downloadButton = document.getElementById('brainDownload');
  const brainStatus = document.getElementById('brainStatus');
  const brainCapability = document.getElementById('brainCapability');
  const brainProgress = document.getElementById('brainProgress');
  const brainFill = document.getElementById('brainFill');
  const brainTrack = document.getElementById('brainTrack');
  const input = document.getElementById('message');
  const sendButton = document.getElementById('sendButton');
  const newChatButton = document.getElementById('newChat');
  const chatArea = document.getElementById('chatArea');
  const chatStream = document.getElementById('chatStream');
  const chatNotice = document.getElementById('chatNotice');
  const history = [];
  let nativeOnline = false, loaded = false, loading = false, generating = false;
  let activeResponse = '', activeAnswer = null;
  function bridge(type, extra = {}) {
    if (!window.ReactNativeWebView || typeof window.ReactNativeWebView.postMessage !== 'function') {
      showNotice('This is the native Android version. Build/install the APK to connect the AI engine; opening this HTML alone cannot run Qwen.');
      return false;
    }
    window.ReactNativeWebView.postMessage(JSON.stringify({ type, ...extra }));
    return true;
  }
  function scrollToReply() { chatArea.scrollTop = chatArea.scrollHeight; }
  function showNotice(text) {
    chatNotice.textContent = text || '';
    chatNotice.hidden = !text;
    if (text) scrollToReply();
  }
  function bubble(role, text = '', status = '') {
    const row = document.createElement('div');
    row.className = 'chat-turn ' + role;
    const body = document.createElement('div');
    body.className = 'chat-bubble' + (status ? ' ' + status : '');
    body.textContent = text;
    row.appendChild(body);
    chatStream.insertBefore(row, chatNotice);
    scrollToReply();
    return body;
  }
  function visibleAnswer(value) {
    return String(value || '').replace(/<think>[\s\S]*?<\/think>/gi, '')
      .replace(/<think>[\s\S]*$/gi,'')
      .replace(/<\/?think>/gi,'').trimStart();
  }
  function setStatus(value, error = false) {
    brainStatus.textContent = value;
    brainStatus.dataset.error = String(error);
  }
  function updateProgress(progressValue, message) {
    brainProgress.hidden = false;
    const valid = Number.isFinite(progressValue) ? Math.min(1, Math.max(0, progressValue)) : 0;
    const percent = Math.round(valid * 100);
    brainFill.style.width = percent + '%';
    brainTrack.setAttribute('aria-valuenow', String(percent));
    setStatus(percent + '% · ' + (message || 'Downloading Qwen3.5…'));
  }
  function endGenerating() {
    generating = false;
    sendButton.disabled = false;
    input.disabled = false;
    activeAnswer?.classList.remove('is-generating');
    input.focus();
    scrollToReply();
  }
  function sendMessage() {
    if (generating || loading) return;
    const prompt = input.value.trim();
    if (!prompt) return;
    if (!loaded) { showNotice('First open Menu → Options → Brain → Download & load brain.'); return; }
    showNotice('');
    input.value = ''; input.style.height = 'auto';
    bubble('user', prompt);
    history.push({role: 'user', content: prompt});
    activeAnswer = bubble('assistant', '', 'is-generating');
    activeResponse = ''; generating = true;
    sendButton.disabled = true; input.disabled = true;
    setStatus('AURA is replying using native Qwen…');
    // A single request carries context for this chat; no persistence or memory yet.
    if (!bridge('send', {messages: history.slice(-16)})) {
      activeAnswer.classList.add('is-error');
      activeAnswer.textContent = 'Native Android connection unavailable.';
      endGenerating();
    }
  }
  sendButton.addEventListener('click', sendMessage);
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault(); sendMessage();
    }
  });
  newChatButton.addEventListener('click', () => {
    if (generating) return;
    history.length=0;
    chatStream.querySelectorAll('.chat-turn').forEach(n=>n.remove());
    showNotice(''); input.value=''; input.focus();
    if (window.matchMedia('(max-width: 720px)').matches) {
      document.getElementById('app').classList.remove('sidebar-open');
      document.getElementById('menuButton').setAttribute('aria-expanded','false');
    }
  });
  optionsButton.addEventListener('click', () => {
    const opening=optionsGroup.hidden; optionsGroup.hidden=!opening;
    optionsButton.setAttribute('aria-expanded',String(opening));
  });
  brainButton.addEventListener('click', () => {
    const opening=brainCard.hidden; brainCard.hidden=!opening;
    brainButton.setAttribute('aria-expanded',String(opening));
  });
  downloadButton.addEventListener('click', () => {
    if (loading || loaded) return;
    loading=true;
    downloadButton.disabled=true;
    downloadButton.textContent='Preparing brain…';
    setStatus('Connecting to native engine…');
    if (!bridge('load')) {
      loading=false; downloadButton.disabled=false;
      downloadButton.textContent='↻ Try again';
    }
  });
  // Called by React Native's WebView injection ONLY (no remote HTML or eval).
  window.AuraNative = {
    receive(data) {
      if (!data || typeof data !== 'object') return;
      switch(data.type) {
        case 'ready':
          nativeOnline=true;
          brainCapability.textContent='✓ Native llama.cpp connected · WebGPU not required';
          brainCapability.dataset.ok='true';
          if (data.modelFound) {
            setStatus('Qwen3.5 model already downloaded. Tap to load.');
            downloadButton.textContent='▶ Load existing brain';
          } else {
            setStatus('Ready to download Qwen3.5 4B (approx. 2.8 GB).');
          }
          break;
        case 'progress':
          updateProgress(Number(data.progress)||0, data.message||'Downloading model…');
          break;
        case 'loading':
          loading=true; brainProgress.hidden=true;
          setStatus(data.message||'Loading native Qwen model…');
          downloadButton.textContent='Loading model…';
          break;
        case 'loaded':
          loaded=true; loading=false; brainProgress.hidden=true;
          downloadButton.textContent='✓ Brain loaded';
          downloadButton.disabled=true;
          brainCapability.textContent='✓ Qwen3.5 running natively · offline-ready';
          brainCapability.dataset.ok='true';
          setStatus('✓ Qwen3.5 4B ready · Native chat connected');
          showNotice('');
          break;
        case 'token':
          if (!generating || !activeAnswer) break;
          activeResponse += String(data.text||'');
          activeAnswer.textContent=visibleAnswer(activeResponse);
          scrollToReply();
          break;
        case 'complete': {
          if (!generating) break;
          const response=visibleAnswer(data.text || activeResponse).trim();
          if (!response) {
            activeAnswer.classList.add('is-error');
            activeAnswer.textContent='The model returned no visible text. Please try again.';
          } else {
            history.push({role:'assistant', content:response});
            activeAnswer.textContent=response;
          }
          setStatus('✓ Qwen3.5 4B ready · Native chat connected');
          endGenerating();
          break;
        }
        case 'error':
          if (generating && activeAnswer) {
            activeAnswer.classList.add('is-error');
            activeAnswer.textContent='Could not generate reply: '+String(data.message||'Unknown error');
            endGenerating();
          } else {
            loading=false; loaded=false; brainProgress.hidden=true;
            downloadButton.disabled=false;
            downloadButton.textContent='↻ Try download/load again';
            setStatus('Could not load: '+String(data.message||'Unknown error'),true);
          }
          break;
      }
    }
  };
  // Ask Android bridge if already mounted; onLoad also triggers this call.
  bridge('hello');
  if (!window.ReactNativeWebView) {
    brainCapability.textContent='HTML preview only · Native APK required';
