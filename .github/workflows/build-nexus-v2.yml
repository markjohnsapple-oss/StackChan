name: Build Nexus Bridge V2 Firmware

on:
  push:
    branches:
      - nexus-bridge-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch StackChan dependencies
        working-directory: firmware
        run: python3 fetch_repos.py

      - name: Build StackChan Nexus V2 firmware
        working-directory: firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          idf.py merge-bin -o stackchan-nexus-v2-full.bin -f raw

      - name: Collect flash files
        run: |
          mkdir -p nexus-v2-firmware
          cp firmware/build/stackchan-nexus-v2-full.bin nexus-v2-firmware/
          cp firmware/build/stack-chan.bin nexus-v2-firmware/
          cp firmware/build/bootloader/bootloader.bin nexus-v2-firmware/
          cp firmware/build/partition_table/partition-table.bin nexus-v2-firmware/
          cp firmware/build/flasher_args.json nexus-v2-firmware/ || true
          cp firmware/build/flash_args nexus-v2-firmware/ || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-nexus-v2-firmware
          path: nexus-v2-firmware
          if-no-files-found: error
