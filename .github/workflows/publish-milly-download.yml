name: Publish Milly Download

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-milly-download.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milly-download
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Milly
        run: python milly/build.py

      - name: Publish downloadable file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add milly/downloads/Milly-AI-Companion.mcaddon
          git commit -m "Publish Milly AI Companion download" || true
          git push origin HEAD:milly-download
