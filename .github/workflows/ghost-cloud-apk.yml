name: Build Ghost Cloud APK
on:
  push:
    branches: [ghost-cloud-apk]
    paths:
      - "ghost-cloud-build/**"
      - ".github/workflows/ghost-cloud-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghost-cloud-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build native Ghost APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload Ghost APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Android-Bluetooth-Audio-APK
          path: ghost-cloud-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
