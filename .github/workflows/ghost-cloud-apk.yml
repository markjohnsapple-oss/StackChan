name: Build Ghost Cloud APK
on:
  push:
    branches: [ghost-cloud-apk]
    paths:
      - "ghost-cloud-build/**"
      - ".github/workflows/ghost-cloud-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghost-cloud-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK platform
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build native Ghost APK
        run: gradle :app:bundleRelease --no-daemon --stacktrace
      - name: Collect APK signing tool
        run: |
          mkdir -p build-helper
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-helper/apksigner.jar
      - name: Upload APK signing tool
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Android-apksigner
          path: ghost-cloud-build/build-helper/apksigner.jar
          if-no-files-found: error
      - name: Upload Ghost APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Android-Bluetooth-Audio-APK
          path: ghost-cloud-build/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
